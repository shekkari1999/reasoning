# SFT Config — Qwen-2.5-3B on 2×96GB (g7e.12xlarge)
# Chain-of-thought supervised fine-tuning

seed: 42

model:
  name: "Qwen/Qwen2.5-3B"
  dtype: "bf16"
  revision: "3aab1f1954e9cc14eb9509a215f9e5ca08227a9b"

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  # Effective batch = 1 × 8 × 2 GPUs = 16
  # mb=1 at seq_len=4096 (~45-50 GB/GPU peak, ~12-15h for 625 steps)
  seq_len: 4096
  num_steps: 625          # 10,000 sample slots at effective batch 16
  warmup_steps: 63        # ~10% warmup

optimizer:
  type: "adamw"
  lr: 2.0e-5
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  type: "cosine"
  min_lr: 2.0e-6

fsdp:
  sharding_strategy: "FULL_SHARD"
  mixed_precision: "bf16"
  activation_checkpointing: true
  forward_prefetch: true

data:
  dataset: "open-r1/OpenR1-Math-220k"
  subset: "default"
  split: "train"
  revision: "e4e141ec9dea9f8326f4d347be56105859b2bd68"
  max_samples: 10000  # subset for weekend project

logging:
  log_every: 10
  save_every: 200         # checkpoint mid-run (~14h run); final at step 625
  output_dir: "checkpoints/sft"

profiling:
  warmup_steps: 10
  capture_steps: 20
