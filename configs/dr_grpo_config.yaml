# Dr.GRPO config for Qwen2.5-3B on two GPUs.

model:
  name: "Qwen/Qwen2.5-3B"
  sft_checkpoint: "checkpoints/sft/final/step_625"

training:
  num_steps: 200
  warmup_steps: 20

optimizer:
  lr: 5.0e-7
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  min_lr: 5.0e-8

dr_grpo:
  group_size: 4
  max_rollout_len: 1024
  num_prompts_per_step: 4
  temperature: 0.7
  top_p: 0.95
  clip_eps: 0.2

fsdp:
  mixed_precision: "bf16"
  activation_checkpointing: true
  forward_prefetch: true

data:
  dataset: "openai/gsm8k"
  split: "train"

logging:
  log_every: 5
  save_every: 50
  output_dir: "checkpoints/dr_grpo"

profiling:
  warmup_steps: 10
  capture_steps: 20
